  </g>
  <!-- ANTAM Text -->
  <text x="94" y="46" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="30" fill="#0f172a" letter-spacing="0.05em">antam</text>
  <text x="96" y="66" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="0.12em">MEMBER OF MIND ID</text>
